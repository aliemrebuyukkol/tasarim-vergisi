<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,"/><title>Pet Companion · Interaction Evidence Demo</title>
<style>
:root{color-scheme:light;--ink:#263845;--sand:#eee3cf;--water:#a9ccd4}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#dbe9e3;color:var(--ink)}
main{max-width:390px;height:844px;max-height:100dvh;margin:auto;position:relative;overflow:hidden;background:linear-gradient(#d9edf0 0 48%,var(--water) 48% 68%,var(--sand) 68%)}
h1{font:600 1.25rem Georgia,serif;margin:32px 24px}#scene{position:absolute;inset:15% 8% 18%;border-radius:30px;outline:1px solid #ffffff70}#player,#pet{position:absolute;bottom:24%;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
#player{left:25%;font-size:3rem}#pet{left:55%;font-size:2.2rem}main.walking #player{transform:translateX(18px)}main.walking #pet{transform:translateX(0)}main.resting #pet{transform:translateX(-40px)}
#status{position:absolute;bottom:128px;left:20px;right:20px;text-align:center;min-height:3rem;font:500 1rem/1.5 system-ui}
nav{position:absolute;bottom:20px;left:20px;right:20px;display:flex;gap:12px}button{flex:1;padding:15px 10px;border:2px solid #284451;background:#fffbed;color:var(--ink);border-radius:16px;font-size:1rem;cursor:pointer}button:focus-visible{outline:3px solid #164a9f;outline-offset:3px}
@media(prefers-reduced-motion:reduce){#player,#pet{transition:none}}
</style>
</head>
<body><main id="app"><h1>Birlikte biraz duralım.</h1><div id="scene" aria-label="Deniz kıyısında karakter ve evcil hayvan sahnesi"><span id="player" role="img" aria-label="Karakter">🚶</span><span id="pet" role="img" aria-label="Kedi">🐈</span></div><p id="status" role="status" aria-live="polite">Deniz kıyısındasın.</p><nav><button id="walk" type="button">Yürü</button><button id="pause" type="button">Dur</button></nav></main><script>
const app=document.querySelector('#app'),status=document.querySelector('#status');
document.querySelector('#walk').addEventListener('click',()=>{app.className='walking';status.textContent='Yürüyorsun. Kedi yanında.'});
document.querySelector('#pause').addEventListener('click',()=>{app.className='resting';status.textContent='Durup birlikte denizi izliyorsunuz.'});
</script></body></html>
