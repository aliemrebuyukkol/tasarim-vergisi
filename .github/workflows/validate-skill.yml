name: Validate Tasarim Vergisi skill

on:
  push:
  pull_request:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static skill validation
        run: python3 scripts/check_skill.py
      - name: Test structural novelty audit
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/tests -v
      - name: Check example idea cards
        run: python3 scripts/idea_audit.py examples/pet-game-directions.json
      - name: Check human perception hypothesis card
        run: python3 scripts/experience_audit.py examples/pet-game-human-lens.json
